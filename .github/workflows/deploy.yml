name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Build & typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  deploy:
    name: Deploy to Cloudflare
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Apply pending D1 migrations
        run: npx wrangler d1 migrations apply marathon-lfg-db --remote
        # Wrangler reads every file in migrations/, applies only ones not yet
        # recorded in the d1_migrations table, and records each on success.

      - name: Sync Worker secrets from GitHub
        env:
          BUNGIE_API_KEY: ${{ secrets.BUNGIE_API_KEY }}
        run: |
          if [ -z "$BUNGIE_API_KEY" ]; then
            echo "::error::BUNGIE_API_KEY GitHub secret is not set. Add it at Settings → Secrets and variables → Actions, then re-run this workflow."
            exit 1
          fi
          # Bulk upload so all Bungie secrets travel together. Add new keys
          # here and they'll sync on the next deploy.
          jq -n --arg k "$BUNGIE_API_KEY" '{BUNGIE_API_KEY: $k}' > "$RUNNER_TEMP/secrets.json"
          npx wrangler secret bulk "$RUNNER_TEMP/secrets.json"
          rm "$RUNNER_TEMP/secrets.json"

      - name: Build & deploy via OpenNext
        id: deploy
        run: |
          npx opennextjs-cloudflare build
          DEPLOY_OUT=$(npx opennextjs-cloudflare deploy 2>&1 | tee /dev/stderr)
          URL=$(echo "$DEPLOY_OUT" | grep -oE 'https://[^ ]+\.workers\.dev' | head -1 || true)
          if [ -n "$URL" ]; then
            echo "url=$URL" >> "$GITHUB_OUTPUT"
          fi
